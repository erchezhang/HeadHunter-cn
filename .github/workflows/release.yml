# Packages the addon and uploads it on every pushed tag: to Wago Addons (X-Wago-ID in
# the TOC, WAGO_API_TOKEN secret), and to CurseForge (X-Curse-Project-ID) only once the
# CF_API_KEY secret is set; without it CurseForge is skipped.
name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
